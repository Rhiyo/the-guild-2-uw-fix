; ================================================================
;  The Guild II Renaissance - Ultrawide HUD Fix
;  Put this file next to GuildII.exe (same folder as the d3d9.dll).
;  Values: 1 = on, 0 = off.  Delete this file to use defaults (all fixes on).
; ================================================================
[UltrawideFix]

; Top-right character panel (3D portrait) -> snap to the right edge
CharacterPanel=1

; Bottom-right button panel (Map / Politics / Wealth / ...) -> bottom-right corner
ButtonPanelRight=1

; Write ultrawide_fix.log to the game folder (0 = silent, recommended for release)
Logging=0

; Extra diagnostic dumps in the log (only needed when troubleshooting; needs Logging=1)
Verbose=0
