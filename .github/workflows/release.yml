name: Release

# Manual trigger only. Pick the branch via GitHub's "Use workflow from" dropdown
# and enter a version; the workflow builds the DLL, zips it together with the ini,
# and creates a release with that single archive attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version / tag (e.g. v1.0.0)"
        required: true
        type: string
      notes:
        description: "Release notes (optional; appears above the auto-generated changelog)"
        required: false
        type: string
      draft:
        description: "Create as a draft (edit/finish notes in the web UI before publishing)"
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW (32-bit)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686

      - name: Build d3d9.dll
        run: make UWFIX_VERSION="${{ inputs.version }}"

      - name: Package DLL + ini into one archive
        run: |
          mkdir -p release
          cp build/d3d9.dll dist/uw_fix.ini release/
          (cd release && zip -j "guild2-uw-fix-${{ inputs.version }}.zip" d3d9.dll uw_fix.ini)
          rm release/d3d9.dll release/uw_fix.ini
          ls -l release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            ${{ inputs.notes }}

            ---
            Ultrawide HUD fix for The Guild II Renaissance.

            **Install:** unzip and copy `d3d9.dll` + `uw_fix.ini` next to `GuildII.exe`.

            **Built and tested against game version 4.64** — it may not work on
            other versions.

            Built from `${{ github.ref_name }}` @ `${{ github.sha }}`.
          files: |
            release/guild2-uw-fix-${{ inputs.version }}.zip
